# Production compose — ALL secrets come from a .env file next to this file
# (never committed). Required vars: POSTGRES_PASSWORD, JWT_SECRET, REDIS_PASSWORD.
# Generate secrets with: openssl rand -base64 48
services:
  postgres:
    image: postgres:15-alpine
    container_name: quiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiquiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aiquiz
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aiquiz -d aiquiz']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  redis:
    image: redis:7-alpine
    container_name: quiz-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: quiz-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3012
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: aiquiz
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: aiquiz
      DB_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGIN: https://quiz.profitbenefit.com
      FRONTEND_URL: https://quiz.profitbenefit.com
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Schema changes ONLY via migrations — never enable synchronize in production.
      DB_SYNCHRONIZE: 'false'
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3012/api/health/liveness || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - quiz-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.profitbenefit.com/api/v1
        NEXT_PUBLIC_IMAGE_HOSTS: api.profitbenefit.com
    container_name: quiz-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.profitbenefit.com/api/v1
      NEXT_PUBLIC_IMAGE_HOSTS: api.profitbenefit.com
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3010/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - quiz-network

networks:
  quiz-network:
    driver: bridge

volumes:
  postgres_prod_data:

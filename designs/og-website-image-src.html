<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Rendered at exactly 1200x630 — this page IS the share image */
  html,body{width:1200px;height:630px;margin:0;overflow:hidden}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;
      background:linear-gradient(135deg,#A5A3E4 0%,#8f7fd8 45%,#BF7076 100%);
      font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#fff}
  /* soft decorative emoji in the bleed area (cropped per platform, adds life at 1.91:1) */
  .deco{position:absolute;font-size:120px;opacity:.16;filter:drop-shadow(0 8px 14px rgba(30,20,80,.25))}
  .d1{top:-28px;left:-18px;transform:rotate(-12deg)}
  .d2{bottom:-30px;right:-14px;transform:rotate(10deg)}
  .d3{top:24px;right:190px;font-size:74px;opacity:.12}
  .d4{bottom:26px;left:170px;font-size:74px;opacity:.12}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;gap:14px;text-align:center}
  .logo{display:flex;align-items:center;gap:18px}
  .logo img{width:112px;height:112px;filter:drop-shadow(0 10px 18px rgba(30,20,80,.35))}
  .word{font-size:96px;font-weight:900;letter-spacing:-2px;line-height:1;
        text-shadow:0 6px 18px rgba(30,20,80,.35)}
  .tagline{font-size:30px;font-weight:700;opacity:.96;text-shadow:0 3px 10px rgba(30,20,80,.3);
           letter-spacing:.4px}
  .tagline b{font-weight:800}
  .sep{opacity:.55;margin:0 10px}
  .domain{margin-top:10px;background:rgba(17,20,56,.5);border:1.5px solid rgba(255,255,255,.55);
          border-radius:999px;padding:8px 26px;font-size:24px;font-weight:800;letter-spacing:1.5px}
</style>
</head>
<body>
<div class="og">
  <span class="deco d1">🧠</span><span class="deco d2">🧩</span>
  <span class="deco d3">😂</span><span class="deco d4">🖼️</span>
  <div class="center">
    <div class="logo">
      <img src="/icon.svg" alt="">
      <span class="word">PigZap</span>
    </div>
    <div class="tagline"><b>Quizzes</b><span class="sep">·</span><b>Riddles</b><span class="sep">·</span><b>Dad Jokes</b><span class="sep">·</span><b>Image Puzzles</b></div>
    <div class="domain">PIGZAP.COM</div>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dots &amp; Boxes 4P — four-way box duel | PigZap</title>
    <meta name="description" content="Four players draw edges and claim boxes — chains decide everything. Empty seats are bots; play solo or invite friends." />
    <meta name="robots" content="noindex" />
    <script src="/shared/theme.js?v=1"></script>
    <style>
      .game-shell { max-width: 620px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; }
      h1 { margin: 8px 0 2px; font-size: 1.7rem; }
      .tagline { margin: 0 0 14px; opacity: .75; font-size: .95rem; }
      .screen[hidden] { display: none; }
      .screen { display: flex; flex-direction: column; gap: 12px; }
      .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; font-size: 1rem; }
      .btn-primary { background: #6d5bd0; color: #fff; }
      .btn-ghost { background: transparent; color: inherit; border: 1px solid rgba(128,128,128,.4); }
      .field { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
      .field input, .field select { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; }
      .msg.flash { color: #d97706; font-weight: 600; }
      .lattice { width: 100%; height: auto; color: #333; }
      @media (prefers-color-scheme: dark) { .lattice { color: #ddd; } }
      .edge-open:hover { stroke: #6d5bd0 !important; stroke-width: 4 !important; }
      .seats-row, .configure-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .seat-chip { border-radius: 999px; padding: 4px 10px; font-size: .85rem; font-weight: 700; border: 2px solid transparent; background: rgba(128,128,128,.12); }
      .seat-chip.active { background: rgba(109,91,208,.25); }
      .score-chip { font-weight: 800; font-size: .9rem; margin-right: 10px; }
      .table-bar { display: flex; justify-content: space-between; align-items: center; }
      .code-label { font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: 2px; }
      .seat-toggle { border-radius: 10px; padding: 6px 10px; cursor: pointer; }
      .status-line { font-weight: 700; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header>
        <a class="back-link" href="/games/index.html">&larr; Games</a>
        <h1>Dots &amp; Boxes — 4 Players</h1>
        <p class="tagline">Draw edges, claim boxes — the chain giveaway decides everything.</p>
      </header>

      <section id="screen-menu" class="screen">
        <label class="field"><span>Your name</span><input id="player-name" maxlength="32" /></label>
        <label class="field">
          <span>Seats</span>
          <select id="seat-count"><option value="4" selected>4</option><option value="3">3</option></select>
        </label>
        <label class="field">
          <span>Bot level</span>
          <select id="bot-tier"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
        </label>
        <button id="btn-create" class="btn btn-primary">Create table (empty seats = bots)</button>
        <label class="field"><span>Join code</span><input id="join-code" maxlength="6" autocapitalize="characters" /></label>
        <button id="btn-join" class="btn btn-primary">Join table</button>
        <p id="menu-msg" class="msg"></p>
      </section>

      <section id="screen-game" class="screen" hidden>
        <div class="table-bar">
          <span id="code-label" class="code-label"></span>
          <button id="btn-copy" class="btn btn-ghost">Copy invite</button>
        </div>
        <div id="seats-row" class="seats-row"></div>
        <div id="board"></div>
        <div id="scores"></div>
        <p id="status" class="status-line"></p>
        <div id="configure-row" class="configure-row"></div>
        <button id="btn-start" class="btn btn-primary" hidden>Start the table</button>
        <button id="btn-leave" class="btn btn-ghost">Leave table</button>
      </section>
    </main>

    <script src="/shared/pig-feedback.js?v=2" defer></script>
    <script src="config.js?v=1"></script>
    <script src="storage.js?v=1"></script>
    <script src="core.js?v=1"></script>
    <script src="game.js?v=1"></script>
  </body>
</html>

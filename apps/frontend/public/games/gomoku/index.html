<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PigZap" />
    <meta property="og:title" content="Gomoku — PigZap Games" />
    <meta property="og:description" content="Five in a row on a 15×15 board — solo against the computer (easy, medium or hard) or duel a friend live from your own phone." />
    <meta property="og:url" content="https://pigzap.com/games/gomoku" />
    <meta property="og:image" content="https://pigzap.com/og/game/gomoku.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gomoku — PigZap Games" />
    <meta name="twitter:description" content="Five in a row on a 15×15 board — solo against the computer or duel a friend live from your own phone." />
    <meta name="twitter:image" content="https://pigzap.com/og/game/gomoku.png" />
    <title>Gomoku — PigZap Games</title>
    <meta
      name="description"
      content="Five in a row on a 15×15 board — solo against the computer (easy, medium or hard) or duel a friend live from your own phone."
    />
    <meta name="theme-color" content="#e8e4f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1b4a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23b45309'/%3E%3Ccircle cx='30' cy='30' r='12' fill='%230f172a'/%3E%3Ccircle cx='70' cy='70' r='12' fill='%23f1f5f9'/%3E%3C/svg%3E"
    />
    <script src="/shared/theme.js?v=1"></script>
    <link rel="stylesheet" href="style.css?v=2" />
    <script type="module" src="game.js?v=2"></script>
  </head>
  <body>
    <main class="app">
      <a class="back-link" href="/games">← All games</a>

      <!-- ============================== MENU ============================== -->
      <section id="screen-menu" class="screen screen--active" aria-label="Gomoku menu">
        <h1 class="menu-title">Gomoku ⚫⚪</h1>
        <p class="tagline">Five in a row — solo vs the computer or a live duel with a friend.</p>

        <div class="card">
          <h2 id="mode-label">Mode</h2>
          <div class="segmented" role="radiogroup" aria-labelledby="mode-label" id="mode-segmented">
            <button type="button" role="radio" aria-checked="true" data-mode="1p">
              🤖 vs Computer
            </button>
            <button type="button" role="radio" aria-checked="false" data-mode="2p">
              👥 2 Players
            </button>
            <button type="button" role="radio" aria-checked="false" data-mode="online">
              ⚔️ Online
            </button>
          </div>

          <div class="row" id="difficulty-row">
            <h2 id="difficulty-label">Difficulty</h2>
            <div
              class="segmented"
              role="radiogroup"
              aria-labelledby="difficulty-label"
              id="difficulty-segmented"
            >
              <button type="button" role="radio" aria-checked="false" data-difficulty="easy">
                Easy
              </button>
              <button type="button" role="radio" aria-checked="true" data-difficulty="medium">
                Medium
              </button>
              <button type="button" role="radio" aria-checked="false" data-difficulty="hard">
                Hard
              </button>
            </div>
          </div>

          <div class="row">
            <h2 id="size-label">Board</h2>
            <div class="segmented" role="radiogroup" aria-labelledby="size-label" id="size-segmented">
              <button type="button" role="radio" aria-checked="true" data-size="15">
                15×15 standard
              </button>
              <button type="button" role="radio" aria-checked="false" data-size="11">
                11×11 quick
              </button>
            </div>
          </div>

          <!-- plan/games/02: live online duel (server-authoritative, 3 s poll) -->
          <div id="online-row" class="online-row hidden">
            <label for="online-name">Your name</label>
            <input type="text" id="online-name" maxlength="24" placeholder="Guest" autocomplete="off" />
            <button type="button" class="primary" id="btn-online-create">⚔️ Create match (you play ⚫)</button>
            <label for="online-code">…or join with a code</label>
            <input type="text" id="online-code" maxlength="6" placeholder="CODE" autocomplete="off" />
            <button type="button" class="ghost" id="btn-online-join">Join match</button>
            <p class="online-status" id="online-status" role="status" aria-live="polite"></p>
          </div>
        </div>

        <div class="card">
          <h2>
            Series
            <span class="scope" id="series-scope">vs computer · medium · 15×15</span>
          </h2>
          <div class="scoreboard">
            <div class="score score--b">
              <span class="num" id="series-b">0</span>
              <span class="label">⚫ wins</span>
            </div>
            <div class="score">
              <span class="num" id="series-draw">0</span>
              <span class="label">Draws</span>
            </div>
            <div class="score score--w">
              <span class="num" id="series-w">0</span>
              <span class="label">⚪ wins</span>
            </div>
          </div>
          <div class="scoreboard-actions">
            <button type="button" class="ghost" id="reset-series">Reset series</button>
          </div>
        </div>

        <button type="button" class="primary" id="btn-play">▶ Play</button>
      </section>

      <!-- ============================= PLAYING ============================= -->
      <section id="screen-playing" class="screen" aria-label="Gomoku board">
        <div class="topbar">
          <button type="button" class="ghost" id="btn-menu">‹ Menu</button>
          <div class="mini-series" id="mini-series">⚫ 0 · 🤝 0 · ⚪ 0</div>
        </div>

        <div class="turn" id="turn" aria-live="polite">⚫'s turn</div>

        <div class="board-wrap">
          <div id="board" class="board" role="group" aria-label="Gomoku board"></div>

          <div
            id="overlay"
            class="overlay hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="overlay-title"
          >
            <div class="overlay-card">
              <div class="overlay-emoji" id="overlay-emoji">🎉</div>
              <h2 class="overlay-title" id="overlay-title">Black wins!</h2>
              <p class="overlay-sub" id="overlay-sub"></p>
              <div class="overlay-actions">
                <button type="button" class="primary" id="btn-next">Next match</button>
                <div class="ghost-row">
                  <button type="button" class="ghost" id="btn-menu2">Menu</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="badge hidden" id="thinking-badge">Computer is thinking…</div>
      </section>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="/shared/pig-feedback.js?v=2"></script>
  </body>
</html>

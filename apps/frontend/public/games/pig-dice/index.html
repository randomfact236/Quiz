<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PigZap" />
    <meta property="og:title" content="Pig Dice — PigZap Games" />
    <meta property="og:description" content="Roll to build a turn score — bank it, or push your luck. First to the target wins. Solo or a live duel." />
    <meta property="og:url" content="https://pigzap.com/games/pig-dice" />
    <meta property="og:image" content="https://pigzap.com/og/game/pig-dice.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pig Dice — PigZap Games" />
    <meta name="twitter:description" content="Roll to build a turn score — bank it, or push your luck." />
    <meta name="twitter:image" content="https://pigzap.com/og/game/pig-dice.png" />
    <title>Pig Dice — PigZap Games</title>
    <meta
      name="description"
      content="Roll to build a turn score — bank it, or push your luck. First to the target wins. Solo or a live duel."
    />
    <meta name="theme-color" content="#d9f2e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#052e1a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23059669'/%3E%3Crect x='26' y='26' width='48' height='48' rx='10' fill='%23f8fafc'/%3E%3Ccircle cx='40' cy='40' r='6' fill='%230f172a'/%3E%3Ccircle cx='60' cy='60' r='6' fill='%230f172a'/%3E%3C/svg%3E"
    />
    <script src="/shared/theme.js?v=1"></script>
    <link rel="stylesheet" href="style.css?v=1" />
    <script type="module" src="game.js?v=3"></script>
  </head>
  <body>
    <main class="app">
      <a class="back-link" href="/games">← All games</a>

      <!-- ============================== MENU ============================== -->
      <section id="screen-menu" class="screen screen--active" aria-label="Pig Dice menu">
        <h1 class="menu-title">Pig Dice 🎲</h1>
        <p class="tagline">Roll to build a turn score — bank it, or push your luck.</p>

        <div class="card">
          <h2 id="mode-label">Mode</h2>
          <div class="segmented" role="radiogroup" aria-labelledby="mode-label" id="mode-segmented">
            <button type="button" role="radio" aria-checked="true" data-mode="1p">
              🤖 vs Computer
            </button>
            <button type="button" role="radio" aria-checked="false" data-mode="2p">
              👥 2 Players
            </button>
            <button type="button" role="radio" aria-checked="false" data-mode="online">
              ⚔️ Online
            </button>
          </div>

          <div class="row" id="difficulty-row">
            <h2 id="difficulty-label">Difficulty</h2>
            <div
              class="segmented"
              role="radiogroup"
              aria-labelledby="difficulty-label"
              id="difficulty-segmented"
            >
              <button type="button" role="radio" aria-checked="false" data-difficulty="easy">
                Easy
              </button>
              <button type="button" role="radio" aria-checked="true" data-difficulty="medium">
                Medium
              </button>
              <button type="button" role="radio" aria-checked="false" data-difficulty="hard">
                Hard
              </button>
            </div>
          </div>

          <div class="row">
            <h2 id="target-label">First to</h2>
            <div class="segmented" role="radiogroup" aria-labelledby="target-label" id="target-segmented">
              <button type="button" role="radio" aria-checked="false" data-target="50">
                50 quick
              </button>
              <button type="button" role="radio" aria-checked="true" data-target="100">
                100 standard
              </button>
            </div>
          </div>

          <!-- plan/games/05: live online duel (the SERVER rolls — fair by design) -->
          <div id="online-row" class="online-row hidden">
            <label for="online-name">Your name</label>
            <input type="text" id="online-name" maxlength="24" placeholder="Guest" autocomplete="off" />
            <button type="button" class="primary" id="btn-online-create">⚔️ Create match (you play 🔴)</button>
            <label for="online-code">…or join with a code</label>
            <input type="text" id="online-code" maxlength="6" placeholder="CODE" autocomplete="off" />
            <button type="button" class="ghost" id="btn-online-join">Join match</button>
            <p class="online-status" id="online-status" role="status" aria-live="polite"></p>
          </div>
        </div>

        <div class="card">
          <h2>
            Series
            <span class="scope" id="series-scope">vs computer · medium</span>
          </h2>
          <div class="scoreboard">
            <div class="score score--r">
              <span class="num" id="series-r">0</span>
              <span class="label">🔴 wins</span>
            </div>
            <div class="score">
              <span class="num" id="series-draw">0</span>
              <span class="label">Draws</span>
            </div>
            <div class="score score--b">
              <span class="num" id="series-b">0</span>
              <span class="label">🔵 wins</span>
            </div>
          </div>
          <div class="scoreboard-actions">
            <button type="button" class="ghost" id="reset-series">Reset series</button>
          </div>
        </div>

        <button type="button" class="primary" id="btn-play">▶ Play</button>
      </section>

      <!-- ============================= PLAYING ============================= -->
      <section id="screen-playing" class="screen" aria-label="Pig Dice table">
        <div class="topbar">
          <button type="button" class="ghost" id="btn-menu">‹ Menu</button>
          <div class="mini-series" id="mini-series">🔴 0 · 🤝 0 · 🔵 0</div>
        </div>

        <div class="turn" id="turn" aria-live="polite">🔴 Red to play</div>

        <div class="table">
          <div class="die" id="die" aria-label="The die">🎲</div>

          <div class="pot">
            <div class="num" id="pot">0</div>
            <div class="label">Turn pot</div>
          </div>

          <div class="banks">
            <div class="bank" data-mark="1" id="bank-1">
              <div class="num" id="score-1">0</div>
              <div class="label">🔴 Red</div>
            </div>
            <div class="bank" data-mark="2" id="bank-2">
              <div class="num" id="score-2">0</div>
              <div class="label">🔵 Blue</div>
            </div>
          </div>

          <p class="notice" id="notice" role="status" aria-live="polite"></p>
        </div>

        <div class="actions">
          <button type="button" id="btn-roll">🎲 Roll</button>
          <button type="button" id="btn-hold">✋ Hold</button>
        </div>

        <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
          <div class="overlay-card">
            <div class="overlay-emoji" id="overlay-emoji">🎉</div>
            <h2 class="overlay-title" id="overlay-title">You win!</h2>
            <p class="overlay-sub" id="overlay-sub"></p>
            <div class="overlay-actions">
              <button type="button" class="primary" id="btn-next">Next match</button>
              <div class="ghost-row">
                <button type="button" class="ghost" id="btn-menu2">Menu</button>
              </div>
            </div>
          </div>
        </div>

        <div class="badge hidden" id="thinking-badge">Computer is deciding…</div>
      </section>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="/shared/pig-feedback.js?v=2"></script>
  </body>
</html>

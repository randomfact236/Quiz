<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Race — crack the code, 3/4 players | PigZap</title>
    <meta name="description" content="One maker invents a hidden code; the rest race to crack it. Bots fill empty seats." />
    <meta name="robots" content="noindex" />
    <script src="/shared/theme.js?v=1"></script>
    <style>
      .game-shell { max-width: 620px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; }
      h1 { margin: 8px 0 2px; font-size: 1.7rem; }
      .tagline { margin: 0 0 14px; opacity: .75; font-size: .95rem; }
      .screen[hidden] { display: none; }
      .screen { display: flex; flex-direction: column; gap: 12px; }
      .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; font-size: 1rem; }
      .btn-primary { background: #6d5bd0; color: #fff; }
      .btn-primary:disabled { opacity: .5; cursor: default; }
      .btn-ghost { background: transparent; color: inherit; border: 1px solid rgba(128,128,128,.4); }
      .field { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
      .field input, .field select { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; }
      .msg.flash { color: #d97706; font-weight: 600; }
      .table-bar { display: flex; justify-content: space-between; align-items: center; }
      .code-label { font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: 2px; }
      .seats-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      .seat-chip { border-radius: 999px; padding: 4px 10px; font-size: .85rem; font-weight: 700; background: rgba(128,128,128,.12); border: 1px solid transparent; }
      .seat-chip.active { border-color: #6d5bd0; background: rgba(109,91,208,.2); }
      .status-line { font-weight: 700; min-height: 1.4em; text-align: center; }
      
      .peg-row { display: flex; gap: 8px; justify-content: center; }
      .peg { width: 40px; height: 40px; border-radius: 999px; border: 2px solid rgba(128,128,128,.4); cursor: pointer; background: transparent; }
      .peg.p1 { background: #e11d48; } .peg.p2 { background: #2563eb; } .peg.p3 { background: #059669; }
      .peg.p4 { background: #d97706; } .peg.p5 { background: #7c3aed; } .peg.p6 { background: #0ea5e9; }
      .peg.picked { outline: 3px solid #6d5bd0; }
      .guess-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 4px; }
      .guess-peg { width: 26px; height: 26px; border-radius: 999px; }
      .fb { font-size: .8rem; font-weight: 800; color: rgba(128,128,128,.9); min-width: 64px; text-align: left; }
      .secret-dots { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
      .secret-dot { width: 22px; height: 22px; border-radius: 999px; border: 2px dashed rgba(128,128,128,.6); }
      .secret-dot.revealed { border-style: solid; }

    </style>
  </head>
  <body>
      <section id="screen-menu" class="screen">
        <label class="field"><span>Your name</span><input id="player-name" maxlength="32" /></label>
        <label class="field">
          <span>Seats</span>
          <select id="seat-count"><option value="4" selected>4 (1 maker + 3 racers)</option><option value="3">3 (1 maker + 2 racers)</option></select>
        </label>
        <label class="field">
          <span>Bot level</span>
          <select id="bot-tier"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
        </label>
        <button id="btn-create" class="btn btn-primary">Create table (empty seats = bots)</button>
        <label class="field"><span>Join code</span><input id="join-code" maxlength="6" autocapitalize="characters" /></label>
        <button id="btn-join" class="btn btn-primary">Join table</button>
        <p id="menu-msg" class="msg"></p>
      </section>
      <section id="screen-game" class="screen" hidden>
        <div class="table-bar">
          <span id="code-label" class="code-label"></span>
          <button id="btn-copy" class="btn btn-ghost">Copy invite</button>
        </div>
        <div id="seats-row" class="seats-row"></div>
        <div id="set-phase" hidden>
          <p class="status-line">You are the MAKER — invent the secret code:</p>
          <div class="peg-row" id="set-pegs"></div>
          <button id="btn-set-code" class="btn btn-primary">Place the secret code</button>
        </div>
        <div id="race-phase" hidden>
          <div id="my-history"></div>
          <div class="peg-row" id="guess-pegs"></div>
          <button id="btn-guess" class="btn btn-primary">Submit guess</button>
        </div>
        <p id="status" class="status-line"></p>
        <button id="btn-start" class="btn btn-primary" hidden>Start the table</button>
        <button id="btn-leave" class="btn btn-ghost">Leave table</button>
      </section>
    </main>
    <script src="/shared/pig-feedback.js?v=2" defer></script>
    <script src="config.js?v=1"></script>
    <script src="storage.js?v=1"></script>
    <script src="core.js?v=1"></script>
    <script src="game.js?v=1"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blokus 4P — the 20x20 corner-touch original | PigZap</title>
    <meta name="description" content="Place all 21 pieces, touch corners only. The four-player classic for 4 seats. Bots fill empty seats." />
    <meta name="robots" content="noindex" />
    <script src="/shared/theme.js?v=1"></script>
    <style>
      :root {
  --gt-text: #1c1917;
  --gt-text-soft: rgba(28,25,23,.75);
  --gt-text-faint: rgba(28,25,23,.6);
  --gt-panel: #ffffff;
  --gt-panel-soft: rgba(255,255,255,.75);
  --gt-border: rgba(128,128,128,.5);
  --gt-cell: rgba(28,25,23,.06);
  --gt-btn-ghost-border: rgba(128,128,128,.4);
}
[data-theme="dark"] {
  --gt-text: #f4f4f5;
  --gt-text-soft: rgba(244,244,245,.78);
  --gt-text-faint: rgba(244,244,245,.6);
  --gt-panel: #23232f;
  --gt-panel-soft: rgba(35,35,47,.8);
  --gt-border: rgba(244,244,245,.28);
  --gt-cell: rgba(244,244,245,.08);
  --gt-btn-ghost-border: rgba(244,244,245,.3);
}

      .game-shell { max-width: 860px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; color: var(--gt-text); }
      h1 { margin: 8px 0 2px; font-size: 1.7rem; color: var(--gt-text); }
      .tagline { margin: 0 0 14px; opacity: .9; font-size: .95rem; color: var(--gt-text-soft); }
      .screen[hidden] { display: none; }
      .screen { display: flex; flex-direction: column; gap: 12px; }
      .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; font-size: 1rem; }
      .btn-primary { background: #6d5bd0; color: #fff; }
      .btn-ghost { background: transparent; color: var(--gt-text); border: 1px solid var(--gt-btn-ghost-border); }
      .field { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
      .field input, .field select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--gt-border); background: var(--gt-cell); color: var(--gt-text); }
      .msg.flash { color: #f59e0b; font-weight: 600; }
      .table-bar { display: flex; justify-content: space-between; align-items: center; }
      .code-label { font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: 2px; color: var(--gt-text); }
      .seats-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      .seat-chip { border-radius: 999px; padding: 4px 10px; font-size: .85rem; font-weight: 700; background: var(--gt-cell); color: var(--gt-text); border: 1px solid transparent; }
      .seat-chip.active { border-color: #6d5bd0; background: rgba(109,91,208,.2); }
      .status-line { font-weight: 700; min-height: 1.4em; text-align: center; color: var(--gt-text); }

      .blk-wrap { display: flex; gap: 14px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
      .blk-board { display: grid; gap: 1px; background: var(--gt-border); border-radius: 8px; padding: 3px;
        width: min(78vw, 540px); aspect-ratio: 1; }
      .blk-cell { background: var(--gt-cell); border-radius: 2px; position: relative; cursor: pointer; }
      .blk-cell:hover { outline: 2px solid rgba(109,91,208,.8); outline-offset: -2px; }
      .blk-cell.c0 { background: #e11d48; } .blk-cell.c1 { background: #2563eb; }
      .blk-cell.c2 { background: #059669; } .blk-cell.c3 { background: #d97706; }
      .blk-cell.corner-hint { box-shadow: inset 0 0 0 2px rgba(109,91,208,.65); }
      .blk-cell.preview { background: rgba(109,91,208,.55) !important; }
      .blk-cell.illegal { background: rgba(220,38,38,.4) !important; }
      .blk-hand { display: flex; flex-direction: column; gap: 8px; width: 240px; }
      .blk-hand-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .blk-piece { border: 2px solid transparent; border-radius: 8px; padding: 5px; background: var(--gt-cell); cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 44px; }
      .blk-piece.sel { border-color: #6d5bd0; background: rgba(109,91,208,.22); }
      .blk-piece.dim { opacity: .35; cursor: default; }
      .blk-piece .mini { display: grid; gap: 1px; }
      .mini i { width: 7px; height: 7px; border-radius: 1px; background: currentColor; }
      .mini i.empty { background: transparent; }
      .blk-actions { display: flex; gap: 8px; }
      .blk-actions .btn { flex: 1; padding: 9px 10px; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header>
        <a href="/games/index.html">&larr; Games</a>
        <h1>Blokus 4P — the corner-touch original</h1>
        <p class="tagline">Four seats, 21 pieces each on a 20×20 board. Pieces touch corner-to-corner only. Most squares placed wins.</p>
      </header>
      <section id="screen-menu" class="screen">
        <label class="field"><span>Your name</span><input id="player-name" maxlength="32" /></label>
        <label class="field">
          <span>Bot level</span>
          <select id="bot-tier"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
        </label>
        <button id="btn-create" class="btn btn-primary">Create table (empty seats = bots)</button>
        <label class="field"><span>Join code</span><input id="join-code" maxlength="6" autocapitalize="characters" /></label>
        <button id="btn-join" class="btn btn-primary">Join table</button>
        <p id="menu-msg" class="msg"></p>
      </section>
      <section id="screen-game" class="screen" hidden>
        <div class="table-bar">
          <span id="code-label" class="code-label"></span>
          <button id="btn-copy" class="btn btn-ghost">Copy invite</button>
        </div>
        <div id="seats-row" class="seats-row"></div>
        <div class="blk-wrap">
          <div id="board" class="blk-board"></div>
          <div class="blk-hand">
            <strong style="font-size:.9rem">Your pieces <span id="hand-count"></span></strong>
            <div id="hand" class="blk-hand-grid"></div>
            <div class="blk-actions">
              <button id="btn-rotate" class="btn btn-ghost">Rotate ⟳</button>
              <button id="btn-pass" class="btn btn-ghost" hidden>Pass</button>
            </div>
            <p class="hint" style="font-size:.78rem;opacity:.65;margin:0">First piece covers your corner. Select a piece, rotate, then click a cell to place it.</p>
          </div>
        </div>
        <p id="status" class="status-line"></p>
        <button id="btn-start" class="btn btn-primary" hidden>Start the table</button>
        <button id="btn-leave" class="btn btn-ghost">Leave table</button>
      </section>
    </main>
    <script src="/shared/pig-feedback.js?v=2" defer></script>
    <script src="/shared/guest.js?v=1"></script>
    <script src="config.js?v=1"></script>
    <script src="storage.js?v=1"></script>
    <script src="core.js?v=1"></script>
    <script src="game.js?v=1"></script>
  </body>
</html>

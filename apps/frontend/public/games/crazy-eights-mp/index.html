<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crazy Eights MP — 3/4 player shedding classic | PigZap</title>
    <meta name="description" content="Match suit or value, eights are wild — shed your hand first. Bots fill empty seats." />
    <meta name="robots" content="noindex" />
    <script src="/shared/theme.js?v=1"></script>
    <style>
      :root {
  --gt-text: #1c1917;
  --gt-text-soft: rgba(28,25,23,.75);
  --gt-text-faint: rgba(28,25,23,.6);
  --gt-panel: #ffffff;
  --gt-panel-soft: rgba(255,255,255,.75);
  --gt-border: rgba(128,128,128,.5);
  --gt-cell: rgba(28,25,23,.06);
  --gt-btn-ghost-border: rgba(128,128,128,.4);
}
[data-theme="dark"] {
  --gt-text: #f4f4f5;
  --gt-text-soft: rgba(244,244,245,.78);
  --gt-text-faint: rgba(244,244,245,.6);
  --gt-panel: #23232f;
  --gt-panel-soft: rgba(35,35,47,.8);
  --gt-border: rgba(244,244,245,.28);
  --gt-cell: rgba(244,244,245,.08);
  --gt-btn-ghost-border: rgba(244,244,245,.3);
}

      .game-shell { max-width: 720px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; color: var(--gt-text); }
      h1 { margin: 8px 0 2px; font-size: 1.7rem; color: var(--gt-text); }
      .tagline { margin: 0 0 14px; opacity: .9; font-size: .95rem; color: var(--gt-text-soft); }
      .screen[hidden] { display: none; }
      .screen { display: flex; flex-direction: column; gap: 12px; }
      .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; font-size: 1rem; }
      .btn-primary { background: #6d5bd0; color: #fff; }
      .btn-ghost { background: transparent; color: var(--gt-text); border: 1px solid var(--gt-btn-ghost-border); }
      .field { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
      .field input, .field select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--gt-border); background: var(--gt-cell); color: var(--gt-text); }
      .msg.flash { color: #f59e0b; font-weight: 600; }
      .table-bar { display: flex; justify-content: space-between; align-items: center; }
      .code-label { font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: 2px; color: var(--gt-text); }
      .seats-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      .seat-chip { border-radius: 999px; padding: 4px 10px; font-size: .85rem; font-weight: 700; background: var(--gt-cell); color: var(--gt-text); border: 1px solid transparent; }
      .seat-chip.active { border-color: #6d5bd0; background: rgba(109,91,208,.2); }
      .status-line { font-weight: 700; min-height: 1.4em; text-align: center; color: var(--gt-text); }

      .ce-center { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 8px 0; }
      .ce-card { width: 52px; height: 74px; border-radius: 8px; border: 2px solid var(--gt-border);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-weight: 800; font-size: 1.05rem; background: #faf7f2; color: #1c1917; position: relative; }
      .ce-card .suit { font-size: 1.3rem; line-height: 1; }
      [data-theme="light"] .ce-card.s1, [data-theme="light"] .ce-card.s2 { background: #fff5f5; }
      [data-theme="dark"] .ce-card.s1, [data-theme="dark"] .ce-card.s2 { background: #2d1f24; }
      .ce-card.back { background: repeating-linear-gradient(45deg, #6d5bd0, #6d5bd0 6px, #5b49c2 6px, #5b49c2 12px); color: transparent; }
      .ce-pile { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .8rem; opacity: .8; }
      .ce-hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 84px; }
      .ce-hand .ce-card { cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,.35); }
      .ce-hand .ce-card.dead { opacity: .4; cursor: default; }
      .ce-hand .ce-card.sel { outline: 3px solid #6d5bd0; }
      .suit-pick { display: flex; gap: 10px; justify-content: center; }
      .suit-pick button { font-size: 1.3rem; padding: 8px 14px; }
      .hint { font-size: .8rem; opacity: .6; text-align: center; }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header>
        <a href="/games/index.html">&larr; Games</a>
        <h1>Crazy Eights MP — 3/4 player shedding classic</h1>
        <p class="tagline">Match the top card's suit or value. Eights are wild — play one and call the next suit. Empty your hand first to win.</p>
      </header>
      <section id="screen-menu" class="screen">
        <label class="field"><span>Your name</span><input id="player-name" maxlength="32" /></label>
        <label class="field">
          <span>Seats</span>
          <select id="seat-count"><option value="4" selected>4 players</option><option value="3">3 players</option></select>
        </label>
        <label class="field">
          <span>Bot level</span>
          <select id="bot-tier"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
        </label>
        <button id="btn-create" class="btn btn-primary">Create table (empty seats = bots)</button>
        <label class="field"><span>Join code</span><input id="join-code" maxlength="6" autocapitalize="characters" /></label>
        <button id="btn-join" class="btn btn-primary">Join table</button>
        <p id="menu-msg" class="msg"></p>
      </section>
      <section id="screen-game" class="screen" hidden>
        <div class="table-bar">
          <span id="code-label" class="code-label"></span>
          <button id="btn-copy" class="btn btn-ghost">Copy invite</button>
        </div>
        <div id="seats-row" class="seats-row"></div>
        <div class="ce-center">
          <div class="ce-pile"><span>Stock · <b id="stock-count">?</b></span><div id="stock-card" class="ce-card back">🂠</div></div>
          <div class="ce-pile"><span>Discard</span><div id="discard-card" class="ce-card">?</div></div>
        </div>
        <div class="suit-pick" id="suit-pick" hidden>
          <span style="align-self:center;font-size:.85rem;opacity:.7">Call suit:</span>
          <button id="pick-0" class="btn btn-ghost">♠</button>
          <button id="pick-1" class="btn btn-ghost">♥</button>
          <button id="pick-2" class="btn btn-ghost">♣</button>
          <button id="pick-3" class="btn btn-ghost">♦</button>
        </div>
        <div id="hand" class="ce-hand"></div>
        <div class="hint"><button id="btn-draw" class="btn btn-ghost" style="padding:6px 12px">Draw a card</button> <button id="btn-pass" class="btn btn-ghost" style="padding:6px 12px" hidden>Pass</button></div>
        <p id="status" class="status-line"></p>
        <button id="btn-start" class="btn btn-primary" hidden>Start the table</button>
        <button id="btn-leave" class="btn btn-ghost">Leave table</button>
      </section>
    </main>
    <script src="/shared/pig-feedback.js?v=2" defer></script>
    <script src="/shared/guest.js?v=1"></script>
    <script src="config.js?v=1"></script>
    <script src="storage.js?v=1"></script>
    <script src="game.js?v=1"></script>
  </body>
</html>

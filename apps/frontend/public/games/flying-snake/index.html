<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flying Snake — PigZap Games</title>
    <meta
      name="description"
      content="Flappy-style arcade: tap to flap against gravity and thread the vine gaps. One tap to retry — how far can you fly?"
    />
    <meta name="theme-color" content="#e8e4f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1b4a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Resolve the site's theme (ai-quiz-theme: light|dark|system) before first
      // paint so the letterbox never flashes the wrong scheme.
      (function () {
        try {
          var stored = localStorage.getItem('ai-quiz-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css?v=3" />
    <script type="module" src="main.js?v=3"></script>
  </head>
  <body>
    <main class="app">
      <a class="back-link" id="back-link" href="/games">← All games</a>

      <div class="stage" id="stage">
        <div class="world-wrap">
          <canvas
            id="world"
            width="720"
            height="960"
            role="img"
            aria-label="Flying Snake — tap to flap the snake through the vine gaps"
          ></canvas>

          <button
            type="button"
            class="mute"
            id="btn-mute"
            aria-pressed="false"
            aria-label="Mute sound effects"
          >
            🔊
          </button>

          <!-- ============================== MENU ============================== -->
          <section
            id="screen-menu"
            class="overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="menu-title"
          >
            <div class="card">
              <div class="card-emoji">🐍</div>
              <h1 class="card-title" id="menu-title">Flying Snake</h1>
              <p class="card-sub">Tap to flap against gravity — thread the vine gaps.</p>
              <p class="best-line" id="menu-best">No best yet — how far can you get?</p>
              <button type="button" class="primary" id="btn-play">▶ Play</button>
              <p class="tiny-hint">Tap anywhere · Space · ↑</p>
            </div>
          </section>

          <!-- ============================= PAUSED ============================= -->
          <section
            id="overlay-pause"
            class="overlay hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="pause-title"
          >
            <div class="card">
              <div class="card-emoji">⏸</div>
              <h2 class="card-title" id="pause-title">Paused</h2>
              <p class="card-sub">The world is held — your fall continues on resume.</p>
              <div class="btn-row">
                <button type="button" class="primary" id="btn-resume">▶ Resume</button>
              </div>
              <div class="btn-row">
                <button type="button" class="ghost" id="btn-pmenu">⌂ Menu</button>
              </div>
            </div>
          </section>

          <!-- ============================ GAME OVER ============================ -->
          <section
            id="overlay-over"
            class="overlay hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="over-title"
          >
            <div class="card">
              <div class="card-emoji">💀</div>
              <h2 class="card-title" id="over-title">Game Over</h2>
              <span class="badge-new hidden" id="badge-new">NEW BEST</span>
              <div class="final-score" id="over-score">0</div>
              <p class="best-line" id="over-medal"></p>
              <p class="best-line" id="over-best">Best 0</p>
              <div class="btn-row">
                <button type="button" class="primary" id="btn-retry">↻ Retry</button>
              </div>
              <div class="btn-row">
                <button type="button" class="ghost" id="btn-share">📤 Share</button>
                <button type="button" class="ghost" id="btn-omenu">⌂ Menu</button>
              </div>
<div class="share-row" id="share-row" hidden>
                  <a class="share-target" id="share-fb" target="_blank" rel="noopener" aria-label="Share on Facebook">Facebook</a>
                  <a class="share-target" id="share-x" target="_blank" rel="noopener" aria-label="Share on X">𝕏</a>
                  <a class="share-target" id="share-wa" target="_blank" rel="noopener" aria-label="Share on WhatsApp">WhatsApp</a>
                  <button type="button" class="share-target" id="share-copy" aria-label="Copy result">🔗 Copy</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
